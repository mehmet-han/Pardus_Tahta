[settings]
# Server API (obfuscated). v6: v5 cihaz taban URL'i. Gerçek istekler client.py'de XOR-gömülü URL ile
# yapılır; bu alan yalnızca teşhis/gösterim içindir. (Eski v4 s_brt.php + wb_user/wb_pass KALDIRILDI.)
api_url = ENC:aHR0cHM6Ly9hcGl2NS5tZWJyZS5jb20udHIvY2xpZW50L2FraWxsaV90YWh0YV9jaWhheg==

# User agent (obfuscated)
user_agent = ENC:YWdlbnRfU21hcnRCb2FydA==

# Tahta kimliği. corporate_code'u setup.sh sorar; board_id'yi "Tahta Yapılandırması" ekranı yazar.
corporate_code = 0
board_id = 0

# Cihaz token'ı (device_token = ENC:<base64>). Tahta "Tahta Yapılandırması" ekranından tanıtılınca
# istemci buraya YAZAR. Yoksa istemci v5'e kimlik doğrulayamaz → tahta fail-safe ile KİLİTLİ açılır.
# device_token =

# Enroll sırrı (enroll_secret = ENC:<base64>). Kurulum USB'sindeki secret.txt'ten setup.sh GÖMER;
# tahta tanıtılır tanıtılmaz istemci SİLER. Pakete asla gömülmez, elle yazılmaz.
# enroll_secret =

# Version information
version = V6.00.11
sub_version = 1

# Network time servers
ntp_servers = time.windows.com,time.google.com,time.cloudflare.com,time.apple.com

# Server polling interval (5 seconds as mentioned)
polling_interval = 5

# USB check interval (3 seconds as in C# implementation)
usb_check_interval = 3

# Maintenance interval (25 seconds as in C# implementation)
maintenance_interval = 25

# Board name for server communication
board_name = Pardus Board

# Admin password (default: 803580)
admin_password = 803580

# Password changed? (false = first install, true = changed)
password_changed = false
